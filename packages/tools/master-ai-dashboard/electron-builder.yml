appId: com.sparkey333.master-ai-command-center
productName: Master AI Command Center
copyright: Copyright © Sparkey333
directories:
  output: release
  buildResources: electron/build
files:
  - dist/**/*
  - electron/main.js
  - package.json
extraMetadata:
  main: electron/main.js
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - universal
  darkModeSupport: true
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
dmg:
  title: Master AI Command Center
  contents:
    - x: 140
      y: 200
      type: file
    - x: 420
      y: 200
      type: link
      path: /Applications
  artifactName: MasterAI-CommandCenter-${version}-mac.${ext}
electronVersion: 33.2.1
